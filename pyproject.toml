[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "2brain-platform"
version = "0.1.0"
description = "2brain AI Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.111.0",
	"uvicorn[standard]>=0.30.0",
	"bcrypt>=4.1.3",
	"pydantic>=2.7.0",
	"pydantic-settings>=2.3.0",
	"sqlalchemy[asyncio]>=2.0.30",
	"asyncpg>=0.29.0",
	"redis>=5.0.4",
	"rq>=1.16.2",
	"langgraph>=0.1.1",
	"openai>=1.35.0",
	"httpx>=0.27.0",
	"structlog>=24.2.0",
	"mem0ai>=0.1.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.2.0",
	"pytest-asyncio>=0.23.7",
	"ruff>=0.4.9",
	"mypy>=1.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "worker*"]
exclude = ["tests*", "specs*", "infra*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
	"integration: tests that require a running stack and external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
